name: Verify Sunnet Mod Loads
on:
  push:
    branches: [ sunnet-build-263 ]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Recreate and build mod
        run: |
          cat sunnet-build-263/setup.part0.b64 sunnet-build-263/setup.part1a.b64 sunnet-build-263/setup.part1b0.b64 sunnet-build-263/setup.part1b1.b64 sunnet-build-263/setup.part1b2.b64 sunnet-build-263/setup.part1c.b64 | base64 -d | gunzip > setup_sunnet.py
          python3 -c 'from pathlib import Path; p=Path("setup_sunnet.py"); s=p.read_text(); i=s.find(r"\nimport struct"); p.write_text(s[:i] + s[i:].replace(r"\n", chr(10)))'
          python3 setup_sunnet.py
          cd generated/mod
          gradle --no-daemon build
      - name: Prepare Fabric 1.21.1 test server
        run: |
          mkdir -p verify-server/mods
          cp generated/mod/build/libs/SunnetMod-26.3.jar verify-server/mods/SunnetMod-26.3-MOD.jar
          cd verify-server
          curl -fL 'https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.16.10/1.0.1/server/jar' -o fabric-server.jar
          curl -fL 'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.116.3+1.21.1/fabric-api-0.116.3+1.21.1.jar' -o mods/fabric-api-0.116.3+1.21.1.jar
          curl -fL 'https://cdn.modrinth.com/data/8BmcQJ2H/versions/5jcq814u/geckolib-fabric-1.21.1-4.6.5.jar' -o mods/geckolib-fabric-1.21.1-4.6.5.jar
          printf 'eula=true\n' > eula.txt
      - name: Start Fabric server and verify Sunnet
        run: |
          cd verify-server
          set +e
          timeout 120s java -Xms512M -Xmx1536M -jar fabric-server.jar nogui > server.log 2>&1
          code=$?
          set -e
          cat server.log
          grep -F 'Loading Minecraft 1.21.1 with Fabric Loader' server.log
          grep -E 'sunnet[[:space:]]+26\.3|Sunnet Mod|Sunnet' server.log
          grep -E 'Done \([0-9.]+s\)!|Done \(' server.log
          if grep -E 'Could not execute entrypoint|EntrypointException|NoClassDefFoundError|NoSuchMethodError|Mixin apply failed|Failed to load|Exception in server tick loop' server.log; then
            echo 'Fatal mod/server load error detected'
            exit 1
          fi
          echo "SUNNET_LOAD_TEST_OK (server exit code: $code)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sunnet-26.3-load-test-log
          path: verify-server/server.log
