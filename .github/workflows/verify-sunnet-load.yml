name: Verify Sunnet Mod Loads
on:
  push:
    branches: [ sunnet-build-263 ]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Recreate and build exact mod
        run: |
          cat sunnet-build-263/setup.part0.b64 sunnet-build-263/setup.part1a.b64 sunnet-build-263/setup.part1b0.b64 sunnet-build-263/setup.part1b1.b64 sunnet-build-263/setup.part1b2.b64 sunnet-build-263/setup.part1c.b64 | base64 -d | gunzip > setup_sunnet.py
          python3 -c 'from pathlib import Path; p=Path("setup_sunnet.py"); s=p.read_text(); i=s.find(r"\nimport struct"); p.write_text(s[:i] + s[i:].replace(r"\n", chr(10)))'
          python3 setup_sunnet.py
          cd generated/mod
          gradle --no-daemon build
          echo 'e7b6256719fa114831092fb5599b31e3e974879d4deb30305b2dfb139788da2d  build/libs/SunnetMod-26.3.jar' | sha256sum -c -
      - name: Prepare Fabric 1.21.1 test server
        run: |
          mkdir -p verify-server/mods
          cp generated/mod/build/libs/SunnetMod-26.3.jar verify-server/mods/SunnetMod-26.3-MOD.jar
          cd verify-server
          curl -fL 'https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.16.10/1.0.1/server/jar' -o fabric-server.jar
          curl -fL 'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.116.3+1.21.1/fabric-api-0.116.3+1.21.1.jar' -o mods/fabric-api-0.116.3+1.21.1.jar
          curl -fL 'https://cdn.modrinth.com/data/8BmcQJ2H/versions/5jcq814u/geckolib-fabric-1.21.1-4.6.5.jar' -o mods/geckolib-fabric-1.21.1-4.6.5.jar
          printf 'eula=true\n' > eula.txt
          printf 'server-port=25566\nonline-mode=false\n' > server.properties
      - name: Start server and verify exact jar loads
        run: |
          cd verify-server
          java -Xms512M -Xmx1536M -jar fabric-server.jar nogui > server.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 75); do
            if grep -q 'Done (' server.log 2>/dev/null; then ok=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat server.log
          test "$ok" -eq 1
          grep -F 'Loading Minecraft 1.21.1 with Fabric Loader 0.16.10' server.log
          grep -F -- '- sunnet 26.3' server.log
          grep -F -- '- geckolib 4.6.5' server.log
          grep -F -- '- fabric-api 0.116.3+1.21.1' server.log
          grep -F 'Done (' server.log
          if grep -E 'Could not execute entrypoint|EntrypointException|NoClassDefFoundError|NoSuchMethodError|Mixin apply failed|Exception in server tick loop' server.log; then exit 1; fi
          echo SUNNET_EXACT_JAR_LOAD_TEST_OK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sunnet-26.3-load-test-log
          path: verify-server/server.log
