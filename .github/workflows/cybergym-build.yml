name: Build CyberGym PvP (isolated branch)
on:
  push:
    branches: [cybergym-pvp-build]
    paths:
      - '.cybergym/source.tar.xz.b64'
      - '.github/workflows/cybergym-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Extract CyberGym source
        run: |
          mkdir -p cybergym
          base64 -d .cybergym/source.tar.xz.b64 | tar -xJ -C cybergym
      - name: Compile, remap and test
        run: gradle --no-daemon --console plain -p cybergym clean build testCore
      - name: Inspect remapped mod JAR
        run: |
          test -s cybergym/build/libs/cybergym-pvp-0.6.0-dev.jar
          unzip -l cybergym/build/libs/cybergym-pvp-0.6.0-dev.jar | grep -F fabric.mod.json
          unzip -l cybergym/build/libs/cybergym-pvp-0.6.0-dev.jar | grep -F CyberGymClient.class
      - name: Save directly downloadable .jar on isolated branch
        run: |
          mkdir -p .cybergym/dist
          cp cybergym/build/libs/cybergym-pvp-0.6.0-dev.jar .cybergym/dist/CyberGym-PvP-Fabric-1.21.11-v0.6.0.jar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .cybergym/dist/CyberGym-PvP-Fabric-1.21.11-v0.6.0.jar
          git commit -m 'Build CyberGym PvP 0.6.0 remapped JAR' || exit 0
          git push
