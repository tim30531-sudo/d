name: Build Sunnet 26.3
on:
  push:
    branches: [ sunnet-build-263 ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Recreate projects
        run: |
          cat sunnet-build-263/setup.part0.b64 sunnet-build-263/setup.part1a.b64 sunnet-build-263/setup.part1b0.b64 sunnet-build-263/setup.part1b1.b64 sunnet-build-263/setup.part1b2.b64 sunnet-build-263/setup.part1c.b64 | base64 -d | gunzip > setup_sunnet.py
          python3 setup_sunnet.py
      - name: Build Paper plugin
        run: |
          cd generated/plugin
          mvn -B -U package
      - name: Build Fabric mod
        run: |
          cd generated/mod
          gradle --no-daemon build
      - name: Collect jars
        run: |
          mkdir -p out
          cp generated/plugin/target/SunnetCelebration-26.3-PLUGIN.jar out/
          cp generated/mod/build/libs/SunnetMod-26.3-MOD.jar out/
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: Sunnet-26.3-JARS
          path: out/*.jar
