name: Build Sunnet 26.3 v2
on:
  push:
    branches: [ sunnet-build-263 ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Recreate
        run: |
          cat sunnet-build-263/setup.part0.b64 sunnet-build-263/setup.part1a.b64 sunnet-build-263/setup.part1b0.b64 sunnet-build-263/setup.part1b1.b64 sunnet-build-263/setup.part1b2.b64 sunnet-build-263/setup.part1c.b64 | base64 -d | gunzip > setup_sunnet.py
          python3 -c 'from pathlib import Path; p=Path("setup_sunnet.py"); s=p.read_text(); i=s.find(r"\nimport struct"); p.write_text(s[:i] + s[i:].replace(r"\n", chr(10)))'
          python3 setup_sunnet.py
      - name: Build plugin
        run: cd generated/plugin && mvn -B -U package
      - name: Build mod
        run: cd generated/mod && gradle --no-daemon build
      - name: Collect
        run: |
          mkdir out
          cp generated/plugin/target/SunnetCelebration-26.3-PLUGIN.jar out/
          cp generated/mod/build/libs/SunnetMod-26.3-MOD.jar out/
      - uses: actions/upload-artifact@v4
        with:
          name: Sunnet-26.3-JARS
          path: out/*.jar
