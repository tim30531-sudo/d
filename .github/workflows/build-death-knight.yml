name: Build Realistic Death Knight Screen

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: death-knight-screen
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate realistic cinematic animation
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_realistic_sheet.py
          test -s src/main/resources/assets/deathknightscreen/textures/gui/death_knight_realistic.png
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile Forge 1.20.1 mod
        run: gradle clean build --stacktrace
      - name: Verify compiled JAR
        run: |
          test -s build/libs/deathknightscreen-1.2.0.jar
          unzip -t build/libs/deathknightscreen-1.2.0.jar
          unzip -l build/libs/deathknightscreen-1.2.0.jar | grep death_knight_realistic.png
      - uses: actions/upload-artifact@v4
        with:
          name: DeathKnightScreen-Realistic-Forge-1.20.1-1.2.0
          path: build/libs/deathknightscreen-1.2.0.jar
