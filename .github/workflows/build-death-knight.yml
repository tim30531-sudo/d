name: Build Death Knight Screen

on:
  push:
    branches: [ death-knight-screen ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build
        run: gradle build --stacktrace
      - name: Collect JAR
        run: |
          mkdir -p dist
          cp build/libs/deathknightscreen-1.0.0.jar dist/DeathKnightScreen-Forge-1.20.1-1.0.0.jar
      - uses: actions/upload-artifact@v4
        with:
          name: DeathKnightScreen-Forge-1.20.1-1.0.0
          path: dist/DeathKnightScreen-Forge-1.20.1-1.0.0.jar
      - name: Commit compiled JAR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/DeathKnightScreen-Forge-1.20.1-1.0.0.jar
          git commit -m "Build compiled death screen mod [skip build]"
          git push
