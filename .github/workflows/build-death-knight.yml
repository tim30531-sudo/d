name: Prepare Realistic Knight Assets

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: death-knight-screen
          fetch-depth: 0
      - name: Download CC0 realistic knight sprites
        run: |
          curl -L --retry 3 --fail "https://opengameart.org/sites/default/files/Knight%202D.zip" -o /tmp/Knight-2D-CC0.zip
          unzip -l /tmp/Knight-2D-CC0.zip > /tmp/knight-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: realistic-knight-assets
          path: |
            /tmp/Knight-2D-CC0.zip
            /tmp/knight-files.txt
