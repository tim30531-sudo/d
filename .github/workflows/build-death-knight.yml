name: Build Death Knight Screen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip death build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: death-knight-screen
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build death-screen mod
        run: gradle build --stacktrace
      - name: Save compiled JAR
        run: |
          cp build/libs/deathknightscreen-1.0.0.jar /tmp/DeathKnightScreen-Forge-1.20.1-1.0.0.jar
          git checkout main
          mkdir -p dist
          cp /tmp/DeathKnightScreen-Forge-1.20.1-1.0.0.jar dist/DeathKnightScreen-Forge-1.20.1-1.0.0.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/DeathKnightScreen-Forge-1.20.1-1.0.0.jar
          git commit -m "Add compiled Death Knight mod [skip death build]"
          git push origin main
