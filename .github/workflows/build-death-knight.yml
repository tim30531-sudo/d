name: Build Death Knight Screen

on:
  push:
    branches: [ death-knight-screen ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build
        run: gradle build --stacktrace
      - name: Collect JAR
        run: |
          mkdir -p dist
          cp build/libs/deathknightscreen-1.0.0.jar dist/DeathKnightScreen-Forge-1.20.1-1.0.0.jar
      - uses: actions/upload-artifact@v4
        with:
          name: DeathKnightScreen-Forge-1.20.1-1.0.0
          path: dist/DeathKnightScreen-Forge-1.20.1-1.0.0.jar
