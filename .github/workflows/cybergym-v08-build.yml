name: Build CyberGym PvP v0.8 AC practice guard
on:
  push:
    branches: [cybergym-pvp-v0.8-ac]
    paths:
      - '.cybergym/overrides/**'
      - '.github/workflows/cybergym-v08-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Extract source and apply v0.8 changes
        run: |
          mkdir -p cybergym
          base64 -d .cybergym/source.tar.xz.b64 | tar -xJ -C cybergym
          cp -a .cybergym/overrides/. cybergym/
          sed -i 's/mod_version=0.6.0-dev/mod_version=0.8.0/' cybergym/gradle.properties
      - name: Compile remap and verify core tests
        run: gradle --no-daemon --console plain -p cybergym clean build testCore
      - name: Inspect remapped Fabric JAR
        run: |
          test -s cybergym/build/libs/cybergym-pvp-0.8.0.jar
          unzip -l cybergym/build/libs/cybergym-pvp-0.8.0.jar | grep -F fabric.mod.json
          unzip -l cybergym/build/libs/cybergym-pvp-0.8.0.jar | grep -F AntiCheatGuard.class
          unzip -l cybergym/build/libs/cybergym-pvp-0.8.0.jar | grep -F CyberGymClient.class
      - name: Publish standalone JAR
        run: |
          mkdir -p .cybergym/dist
          cp cybergym/build/libs/cybergym-pvp-0.8.0.jar .cybergym/dist/CyberGym-PvP-Fabric-1.21.11-v0.8.0.jar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .cybergym/dist/CyberGym-PvP-Fabric-1.21.11-v0.8.0.jar
          git commit -m 'Publish CyberGym v0.8 remapped production jar' || exit 0
          git push
