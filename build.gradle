plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                deathknightscreen {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories { }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

def referenceJar = layout.buildDirectory.file('reference/klleyys-hearts-reference.jar')

tasks.register('downloadReferenceAssets') {
    outputs.file(referenceJar)
    doLast {
        def target = referenceJar.get().asFile
        target.parentFile.mkdirs()
        new URL('https://edge.forgecdn.net/files/6915/133/klleyys_hearts-2.0.2%20HOTFIX-forge-1.20.1.jar').withInputStream { input ->
            target.withOutputStream { output -> output << input }
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('downloadReferenceAssets')
    from(referenceJar) {
        into 'reference'
        rename { 'klleyys-hearts-reference.jar' }
    }
    var replaceProperties = [
            minecraft_version: minecraft_version,
            forge_version: forge_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title': mod_name,
                'Specification-Vendor': 'tim30531',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': 'tim30531'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
